services:
  offlineu:
    image: ghcr.io/nickkk333/offlineu:main
    # Uncomment the next line to build the image from this folder instead of pulling it:
    # build: .
    container_name: offlineu-app
    ports:
      - "5000:5000"
    environment:
      # /courses is the mount point of this image; map your own folder onto it.
      - OFFLINEU_ROOTS=/courses
      # Optional: name shown in the UI instead of the mount point name
      # - OFFLINEU_ROOTS_LABEL=My courses
      # Keep progress files and the course list out of the (read-only) course folder.
      - OFFLINEU_PROGRESS_DIR=/app/data
      # Where converted media (HLS segments, remuxed MP4s) is written. The default
      # is the system temp folder, which on a NAS is usually the small system
      # disk: point it at a big volume and map that volume below.
      - OFFLINEU_CACHE_DIR=/app/cache
      # Oldest file first, so the cache can never fill the disk (GiB).
      - OFFLINEU_CACHE_LIMIT_GB=20
      # Re-encoding a lesson: never more than 720p (it only shrinks - a 480p
      # source stays 480p). 0 keeps the source size, "ultrafast" is the preset
      # for a really weak CPU.
      # - OFFLINEU_TRANSCODE_HEIGHT=720
      # - OFFLINEU_TRANSCODE_PRESET=veryfast
      # Hardware encoding: auto (default) picks NVENC / Quick Sync / VAAPI /
      # AMF / V4L2 / RKMPP, off never asks, or name one to force it.
      # - OFFLINEU_HWACCEL=auto
      # Transport streams (.ts) a platform ships with deliberately broken packets
      # only play when re-encoded: set this to 1 if copying hands the damage to
      # the browser and playback fails.
      # - OFFLINEU_FORCE_REENCODE=1
      # Optional: skip the picker and load a course at startup.
      # - AUTO_LOAD_COURSE=/courses/My Course
    volumes:
      # Mount your course library here (read-only is enough, progress lives in ./data).
      # Without this line the picker stays empty and asks you to add it.
      - ./courses:/courses:ro
      # Mount a local directory for user data/progress
      - ./data:/app/data
      # Scratch space for converted media (see OFFLINEU_CACHE_DIR above)
      - ./cache:/app/cache
    # Hardware encoding (OFFLINEU_HWACCEL=auto, the default) needs the device
    # nodes of the host. Uncomment the ones your machine has - a missing node
    # makes Docker refuse to start, so only enable what exists. Without any of
    # them OfflineU re-encodes in software, which still works, just slower.
    # devices:
    #   - /dev/dri:/dev/dri                  # Intel / AMD / Rockchip iGPU
    #   - /dev/video0:/dev/video0            # ARM V4L2 memory-to-memory
    #   - /dev/nvidia0:/dev/nvidia0          # NVIDIA NVENC
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    # The container runs as uid 10001, but the image hands that uid the read
    # capability CAP_DAC_OVERRIDE: a mapped folder is readable even when it
    # belongs to root or to another NAS account, with no --privileged and no
    # chmod on the NAS (see "Permissions" in README.md).
    # Only if the capability is unavailable does the picker report "mapped, but
    # not readable" - because the container dropped it (cap_drop),
    # no-new-privileges is set, or the folder is a network share that checks
    # permissions itself. Then either fix the host permissions
    # (chmod -R a+rX), or run as the folder's owner - fnOS's first user is
    # normally 1000:1000 - or as root:
    # user: "1000:1000"
    # user: "0:0"
    #
    # Hardening stays possible: cap_drop is harmless as long as DAC_OVERRIDE is
    # not dropped (the entrypoint then starts the plain binary and OfflineU keeps
    # working), no-new-privileges only costs the built-in capability, and a
    # dropped capability can be handed back with the line below (measured:
    # cap_add is applied after cap_drop).
    # cap_drop: ["ALL"]
    # cap_add: ["DAC_OVERRIDE"]
    restart: unless-stopped
    healthcheck:
      # BusyBox wget is part of the Alpine base image used by the Dockerfile.
      # $${...} is escaped for Compose so the container's own shell expands it:
      # the probe follows OFFLINEU_PORT instead of assuming the image default.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${OFFLINEU_PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
