services:
  offlineu:
    image: ghcr.io/nickkk333/offlineu:main
    # Uncomment the next line to build the image from this folder instead of pulling it:
    # build: .
    container_name: offlineu-app
    ports:
      - "5000:5000"
    environment:
      # Everything under /app/courses is browsable and servable, nothing else.
      - OFFLINEU_ROOTS=/app/courses
      # Keep progress files and the course list out of the (read-only) course folder.
      - OFFLINEU_PROGRESS_DIR=/app/data
      # Optional: skip the picker and load a course at startup.
      # - AUTO_LOAD_COURSE=/app/courses/My Course
    volumes:
      # Mount your course library here (read-only is enough, progress lives in ./data)
      - ./courses:/app/courses:ro
      # Mount a local directory for user data/progress
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # BusyBox wget is part of the Alpine base image used by the Dockerfile.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
