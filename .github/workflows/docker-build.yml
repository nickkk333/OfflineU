name: Build & Release OfflineU

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # 手动补跑某个 tag（例如在加上 fpk 打包之前就打好 tag 的版本）：
  # 选择 tag 作为运行目标即可，release 步骤会把包补挂到这个 Release 上
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- One single place that decides the version of everything below.
  #   * push to main/master (or a PR) -> "latest"
  #   * push of a v* tag              -> the tag without the leading "v"
  # The number is baked into the image tag, the image file name and every
  # release asset, so nothing is ever typed by hand.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
    - name: Compute version (tag -> X.Y.Z, otherwise latest)
      id: v
      run: |
        # workflow_dispatch can be aimed at an existing tag to re-attach assets;
        # GITHUB_REF_TYPE is not always "tag" in that case, so check the ref too.
        if [ "${GITHUB_REF_TYPE}" = "tag" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          V="${GITHUB_REF_NAME#v}"
          R="true"
        else
          V="latest"
          R="false"
        fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "is_release=$R" >> "$GITHUB_OUTPUT"
        echo "version: $V (release: $R)"

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Formatting / vet / test
      run: |
        test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }
        go vet ./...
        go test ./... -count=1

    - name: Verify the embedded frontend
      run: go run . --check-web

  # ---- Docker image: multi-arch (amd64 + arm64), pushed to ghcr.io ----
  # Push to main/master  -> ghcr.io/<repo>:latest (rolling) + :main + :sha-...
  # Push of a v* tag     -> ghcr.io/<repo>:X.Y.Z + :X.Y (+ :sha-...)
  docker:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (for arm64 emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          VERSION=${{ needs.version.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ---- 64-bit (linux/amd64) image file for an offline `docker load` ----
  # Same image the multi-arch push above ships, exported as a plain tar:
  #   main push -> offlineu-amd64-latest.tar     (artifact only)
  #   v2.1.6    -> offlineu-amd64-2.1.6.tar      (artifact + GitHub release asset)
  image-tar:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build linux/amd64 and export the image file
      env:
        V: ${{ needs.version.outputs.version }}
      run: |
        set -e
        docker buildx build --platform linux/amd64 --load \
          --build-arg VERSION="$V" \
          -t offlineu:local -t "offlineu:$V" \
          --cache-from type=gha --cache-to type=gha,mode=max \
          -f Dockerfile .
        docker save offlineu:local "offlineu:$V" -o "offlineu-amd64-$V.tar"
        ls -lh "offlineu-amd64-$V.tar"
        docker image inspect "offlineu:$V" --format '{{.Os}}/{{.Architecture}} {{.Size}}'

    - name: Upload image tar artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-${{ needs.version.outputs.version }}-image-amd64
        path: offlineu-amd64-${{ needs.version.outputs.version }}.tar
        retention-days: 14

  # ---- 飞牛 fnOS 的 .fpk 外壳 ----
  # 包内只有 manifest / 生命周期脚本 / 安装向导 / compose，应用本体是 ghcr 上刚推送的
  # 那个 tag，所以目标机需要能拉取镜像（离线时先导入 image tar，或改 FNOS_IMAGE）。
  # platform=x86 是 fnOS 官方标识，指 64 位 x86_64（镜像为 linux/amd64），不是 32 位；
  # 写 x64 会被系统拒绝安装，因此主包仍是 _x86.fpk，另复制一份 _x64.fpk 便于按 64 位名称取用。
  #   v2.1.21 -> offlineu_2.1.21_x86.fpk + offlineu_2.1.21_x64.fpk
  # 要出 ARM 包时，把下面的平台改成矩阵：[x86, arm]
  fnos-fpk:
    name: Build fnOS .fpk (x86_64 / x64)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the fpk
      env:
        V: ${{ needs.version.outputs.version }}
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      run: |
        set -e
        # 镜像引用必须全小写，否则 compose 起容器时会报 "invalid reference format"
        IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
        bash packaging/fnos-app/build-fpk.sh "$V" x86 "$IMAGE:$V"
        tar -xzOf "image-dist/offlineu_${V}_x86.fpk" manifest
        # Same bytes, x64 name: fnOS only accepts platform=x86 in the manifest,
        # but users often look for a 64-bit-named package.
        cp "image-dist/offlineu_${V}_x86.fpk" "image-dist/offlineu_${V}_x64.fpk"

    - name: Upload fpk artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-${{ needs.version.outputs.version }}-fnos-fpk
        path: image-dist/*.fpk
        retention-days: 14

  # ---- Android client: a directly sideloadable debug APK on every push ----
  # A v* tag additionally attaches it to the GitHub Release (see release job).
  android-apk:
    name: Build Android APK
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    # ubuntu-latest already ships an Android SDK. setup-android@v3 tries to
    # install the retired "tools" package and fails on newer cmdline-tools
    # ("Failed to find package 'tools'"), so wire up the preinstalled SDK and
    # install only the two components AGP 8.5.2 needs.
    - name: Use preinstalled Android SDK
      run: |
        set -e
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
        if [ -z "$SDKMANAGER" ]; then
          echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
          exit 1
        fi
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
        echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
        "$SDKMANAGER" --version

    - name: Accept licenses and install Android SDK 34
      run: |
        set -e
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
        test -d "$ANDROID_HOME/platforms/android-34"
        test -d "$ANDROID_HOME/build-tools/34.0.0"

    - name: Assemble debug APK
      working-directory: android
      env:
        V: ${{ needs.version.outputs.version }}
      run: |
        set -e
        # The wrapper was committed from Windows, so it has no executable bit.
        chmod +x gradlew
        VERSION_ARGS=""
        if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
          VERSION_ARGS="-PappVersionName=$V -PappVersionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))"
        fi
        ./gradlew assembleDebug --no-daemon --stacktrace $VERSION_ARGS
        cp app/build/outputs/apk/debug/app-debug.apk "../offlineu-android-$V.apk"
        ls -lh "../offlineu-android-$V.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-${{ needs.version.outputs.version }}-android-apk
        path: offlineu-android-*.apk
        retention-days: 14
        if-no-files-found: error

  # ---- Release: attach the image file, the fnOS package and the APK when a v* tag is pushed ----
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker, image-tar, fnos-fpk, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Compute version (without the leading v)
      id: ver
      run: |
        echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        # ghcr 的镜像名必须小写，而 github.repository 会保留大小写（nickkk333/OfflineU）
        echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: offlineu-*
        merge-multiple: true

    - name: Generate checksums
      working-directory: artifacts
      run: sha256sum * > checksums.txt

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        body: |
          ## OfflineU ${{ github.ref_name }}

          应用本体只走 **Docker**（多架构镜像仓库 + 64 位 `linux/amd64` 镜像文件）；
          飞牛 fnOS 另有一个 `.fpk` 安装外壳，里面跑的也是同一个镜像；
          手机端提供可直接侧载的 Android `.apk`（WebView 客户端）。

          ### Docker（多架构 amd64 / arm64）
          ```bash
          docker pull ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
          docker run -d --name offlineu -p 5000:5000 \
            -v "/path/to/your/courses:/courses:ro" \
            -v offlineu-data:/app/data \
            ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
          ```
          > 想一直跟最新版用 `ghcr.io/${{ steps.ver.outputs.image }}:latest` —— 每次推送 main/master 都会自动重建并更新该 tag；本 Release 对应的镜像固定为 `:${{ steps.ver.outputs.version }}`。

          ### 64 位镜像文件（离线 `docker load`，无需镜像仓库）
          `offlineu-amd64-${{ steps.ver.outputs.version }}.tar`（linux/amd64）：
          ```bash
          docker load -i offlineu-amd64-${{ steps.ver.outputs.version }}.tar
          docker run -d --name offlineu -p 5000:5000 \
            -v "/path/to/your/courses:/courses:ro" \
            -v offlineu-data:/app/data \
            offlineu:${{ steps.ver.outputs.version }}
          ```

          ### 飞牛 fnOS 应用包（.fpk，64 位 x86_64）
          `offlineu_${{ steps.ver.outputs.version }}_x86.fpk` —— 在「应用中心 → 手动安装」里直接装。
          `platform = x86` 是飞牛官方的架构标识（V1.1.8+ 仅支持 `x86` / `arm` / `all`），
          对应 64 位 `x86_64` 机器，包内镜像为 `linux/amd64`；写成 `x64` 会被判为不符合系统要求。
          另附完全相同的 `offlineu_${{ steps.ver.outputs.version }}_x64.fpk` 副本，
          按 64 位名称取用即可；**安装时建议用 `_x86.fpk`**，其文件名与 manifest 一致。
          安装向导只问课程目录（只读挂载到 `/courses`），进度与转码缓存落在安装卷的
          `@appshare/offlineu`；装好后到「应用设置 → 授权目录」把该目录授权给本应用。
          容器使用 host 网络，直接占用宿主机 5000 端口（投屏依赖组播）。
          > 包里不含镜像，NAS 需要能拉取 `ghcr.io/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}`；
          > 离线环境请先导入下面的镜像文件，或重新用 `FNOS_IMAGE` 指向本地仓库打包。

          ### Android 客户端（.apk）
          `offlineu-android-${{ steps.ver.outputs.version }}.apk` —— 安装后在登录页填写服务器地址，
          还可以直接配置 WebDAV / SMB / 本地目录课程来源。
          > CI 使用自动生成的 debug 签名，可直接 `adb install -r` 侧载；上架前请按
          > [`android/README.md`](android/README.md) 配置正式签名。

          | 文件 | 说明 |
          | --- | --- |
          | `offlineu-amd64-${{ steps.ver.outputs.version }}.tar` | Docker 镜像文件（linux/amd64，`docker load -i` 用） |
          | `offlineu_${{ steps.ver.outputs.version }}_x86.fpk` | 飞牛 fnOS 安装包（x86 = 64 位 x86_64，手动安装用这个） |
          | `offlineu_${{ steps.ver.outputs.version }}_x64.fpk` | 同一个 64 位安装包的 x64 命名副本（内容完全一致） |
          | `offlineu-android-${{ steps.ver.outputs.version }}.apk` | Android 客户端（debug 签名，可直接侧载） |
          | `checksums.txt` | SHA-256 校验和 |

          版本号跟随 git tag（`${{ github.ref_name }}` → `${{ steps.ver.outputs.version }}`），镜像 tag、`--build-arg VERSION` 与文件名同步。
