name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }

    - name: Vet
      run: go vet ./...

    - name: Run test suite
      run: go test ./... -count=1

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Verify the embedded frontend
      run: go run . --check-web

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Build the fnOS .fpk with the official fnpack tool. Fully offline: the Docker
  # image is built locally here and exported to app/images/offlineu-amd64.tar so
  # it ships inside the package; cmd/main (native app) docker-loads it on start
  # (no registry needed on the NAS). amd64/x86 only.
  fpk:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and export the image into the package
      run: |
        set -e
        docker buildx build --platform linux/amd64 --load \
          -t offlineu:local -f Dockerfile .
        mkdir -p fnos/offlineu/app/images
        docker save offlineu:local -o fnos/offlineu/app/images/offlineu-amd64.tar
        ls -lh fnos/offlineu/app/images/offlineu-amd64.tar

    - name: Install fnpack
      run: |
        set -e
        for V in 1.2.3 1.2.1 1.2.0; do
          if curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-${V}-linux-amd64" -o fnpack; then
            echo "using fnpack ${V}"; FNPACK_VERSION="${V}"; break
          fi
        done
        chmod +x fnpack
        sudo mv fnpack /usr/local/bin/fnpack
        fnpack --help >/dev/null 2>&1 || true

    - name: Pin manifest to x86
      working-directory: fnos/offlineu
      run: |
        sed -i 's/^platform[[:space:]]*=.*/platform = x86/' manifest
        grep -E '^(appname|version|platform) ' manifest

    - name: Build fpk
      working-directory: fnos/offlineu
      run: |
        set -e
        fnpack build
        mv ./*.fpk "$GITHUB_WORKSPACE/offlineu_1.0.0_x86.fpk"
        ls -l "$GITHUB_WORKSPACE/offlineu_1.0.0_x86.fpk"

    - name: Upload fpk artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-fpk-x86
        path: offlineu_1.0.0_x86.fpk
        retention-days: 30

    - name: Attach fpk to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: offlineu_1.0.0_x86.fpk
