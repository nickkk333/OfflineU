name: Build & Release OfflineU

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- One single place that decides the version of everything below.
  #   * push to main/master (or a PR) -> "latest"
  #   * push of a v* tag              -> the tag without the leading "v"
  # The number is baked into the image tag, the image file name and every
  # release asset, so nothing is ever typed by hand.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
    - name: Compute version (tag -> X.Y.Z, otherwise latest)
      id: v
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          V="${GITHUB_REF_NAME#v}"
          R="true"
        else
          V="latest"
          R="false"
        fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "is_release=$R" >> "$GITHUB_OUTPUT"
        echo "version: $V (release: $R)"

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Formatting / vet / test
      run: |
        test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }
        go vet ./...
        go test ./... -count=1

    - name: Verify the embedded frontend
      run: go run . --check-web

  # ---- Docker image: multi-arch (amd64 + arm64), pushed to ghcr.io ----
  # Push to main/master  -> ghcr.io/<repo>:latest (rolling) + :main + :sha-...
  # Push of a v* tag     -> ghcr.io/<repo>:X.Y.Z + :X.Y (+ :sha-...)
  docker:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (for arm64 emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          VERSION=${{ needs.version.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ---- 64-bit (linux/amd64) image file for an offline `docker load` ----
  # Same image the multi-arch push above ships, exported as a plain tar:
  #   main push -> offlineu-amd64-latest.tar     (artifact only)
  #   v2.1.6    -> offlineu-amd64-2.1.6.tar      (artifact + GitHub release asset)
  image-tar:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build linux/amd64 and export the image file
      env:
        V: ${{ needs.version.outputs.version }}
      run: |
        set -e
        docker buildx build --platform linux/amd64 --load \
          --build-arg VERSION="$V" \
          -t offlineu:local -t "offlineu:$V" \
          --cache-from type=gha --cache-to type=gha,mode=max \
          -f Dockerfile .
        docker save offlineu:local "offlineu:$V" -o "offlineu-amd64-$V.tar"
        ls -lh "offlineu-amd64-$V.tar"
        docker image inspect "offlineu:$V" --format '{{.Os}}/{{.Architecture}} {{.Size}}'

    - name: Upload image tar artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-${{ needs.version.outputs.version }}-image-amd64
        path: offlineu-amd64-${{ needs.version.outputs.version }}.tar
        retention-days: 14

  # ---- Release: attach the 64-bit image file when a v* tag is pushed ----
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker, image-tar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Compute version (without the leading v)
      id: ver
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: offlineu-*
        merge-multiple: true

    - name: Generate checksums
      working-directory: artifacts
      run: sha256sum * > checksums.txt

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        body: |
          ## OfflineU ${{ github.ref_name }}

          分发方式只有 **Docker**（64 位 `linux/amd64` 镜像文件 + 多架构镜像仓库）。

          ### Docker（多架构 amd64 / arm64）
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          docker run -d --name offlineu -p 5000:5000 \
            -v "/path/to/your/courses:/courses:ro" \
            -v offlineu-data:/app/data \
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          ```
          > 想一直跟最新版用 `ghcr.io/${{ github.repository }}:latest` —— 每次推送 main/master 都会自动重建并更新该 tag；本 Release 对应的镜像固定为 `:${{ steps.ver.outputs.version }}`。

          ### 64 位镜像文件（离线 `docker load`，无需镜像仓库）
          `offlineu-amd64-${{ steps.ver.outputs.version }}.tar`（linux/amd64）：
          ```bash
          docker load -i offlineu-amd64-${{ steps.ver.outputs.version }}.tar
          docker run -d --name offlineu -p 5000:5000 \
            -v "/path/to/your/courses:/courses:ro" \
            -v offlineu-data:/app/data \
            offlineu:${{ steps.ver.outputs.version }}
          ```

          | 文件 | 说明 |
          | --- | --- |
          | `offlineu-amd64-${{ steps.ver.outputs.version }}.tar` | Docker 镜像文件（linux/amd64，`docker load -i` 用） |
          | `checksums.txt` | SHA-256 校验和 |

          版本号跟随 git tag（`${{ github.ref_name }}` → `${{ steps.ver.outputs.version }}`），镜像 tag、`--build-arg VERSION` 与文件名同步。
