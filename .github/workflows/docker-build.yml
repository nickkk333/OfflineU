name: Build & Release OfflineU

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Formatting / vet / test
      run: |
        test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }
        go vet ./...
        go test ./... -count=1

    - name: Verify the embedded frontend
      run: go run . --check-web

  # ---- Docker image: multi-arch, pushed to ghcr.io ----
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (for arm64 emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ---- Native binaries: Linux (amd64/arm64) + Windows (amd64) ----
  # The version baked into the binary follows the git tag (vX.Y.Z -> X.Y.Z);
  # on branch/PR builds it falls back to 0.0.0-dev.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build frontend
      working-directory: web
      run: npm ci && npm run build

    - name: Build binary (${{ matrix.goos }}/${{ matrix.goarch }})
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        EXT: ${{ matrix.ext }}
        CGO_ENABLED: "0"
        VERSION: ${{ github.ref_name }}
      run: |
        set -e
        V="${VERSION#v}"
        case "$V" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) V="0.0.0-dev" ;;
        esac
        OUT="offlineu-${GOOS}-${GOARCH}${EXT}"
        go build -trimpath -ldflags="-s -w -X github.com/nickkk333/offlineu/internal/offlineu.Version=$V" -o "$OUT" .
        ls -l "$OUT"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-${{ matrix.goos }}-${{ matrix.goarch }}
        path: offlineu-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
        retention-days: 30

  # ---- fnOS package (.fpk): amd64 / x86 only, fully offline ----
  # The image is built locally here and exported into the package; cmd/main
  # docker-loads it on start, so the NAS never reaches out to any registry.
  # On a tag push the manifest version is pinned to the tag so the .fpk name
  # tracks the release (e.g. v2.0.0 -> offlineu_2.0.0_x86.fpk).
  fpk:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and export the image into the package
      run: |
        set -e
        docker buildx build --platform linux/amd64 --load \
          -t offlineu:local -f Dockerfile .
        mkdir -p fnos/offlineu/app/images
        docker save offlineu:local -o fnos/offlineu/app/images/offlineu-amd64.tar
        ls -lh fnos/offlineu/app/images/offlineu-amd64.tar

    - name: Install fnpack
      run: |
        set -e
        for V in 1.2.3 1.2.1 1.2.0; do
          if curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-${V}-linux-amd64" -o fnpack; then
            echo "using fnpack ${V}"; break
          fi
        done
        chmod +x fnpack
        sudo mv fnpack /usr/local/bin/fnpack
        fnpack --help >/dev/null 2>&1 || true

    - name: Pin manifest to x86 and set version
      working-directory: fnos/offlineu
      run: |
        sed -i 's/^platform[[:space:]]*=.*/platform = x86/' manifest
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^version[[:space:]]*=.*/version = ${V}/" manifest
        fi
        grep -E '^(appname|version|platform) ' manifest

    - name: Build fpk
      working-directory: fnos/offlineu
      run: |
        set -e
        fnpack build
        fpk=$(ls ./*.fpk | head -n1)
        mv "$fpk" "$GITHUB_WORKSPACE/"
        ls -l "$GITHUB_WORKSPACE"/*.fpk

    - name: Upload fpk artifact
      uses: actions/upload-artifact@v4
      with:
        name: offlineu-fpk-x86
        path: "*.fpk"
        retention-days: 30

  # ---- Release: attach every asset when a v* tag is pushed ----
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker, binaries, fpk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Compute version (without the leading v)
      id: ver
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: offlineu-*
        merge-multiple: true

    - name: Generate checksums
      working-directory: artifacts
      run: sha256sum * > checksums.txt

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        body: |
          ## OfflineU ${{ github.ref_name }}

          ### Docker (multi-arch amd64 / arm64)
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          docker run -d --name offlineu -p 5000:5000 \
            -v "/path/to/your/courses:/courses:ro" \
            -v offlineu-data:/app/data \
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          ```

          ### 飞牛OS / fnOS（仅 amd64）
          应用中心 → 手动安装 → 上传 `offlineu_${{ steps.ver.outputs.version }}_x86.fpk`（内置镜像，离线安装，无需镜像仓库）。

          ### Linux / Windows 原生二进制
          直接运行对应可执行文件（前端已内嵌），例如：
          ```bash
          ./offlineu-linux-amd64 --host 0.0.0.0 --port 5000
          ./offlineu-linux-arm64 --host 0.0.0.0 --port 5000
          .\offlineu-windows-amd64.exe --port 5000
          ```
          > 实时转封装（MKV / MPEG-TS → 浏览器原生 MP4）依赖 `ffmpeg`：原生二进制首次播放会自动下载静态 ffmpeg，或自行安装并放入 PATH / 设置 `OFFLINEU_FFMPEG`。

          | 文件 | 说明 |
          | --- | --- |
          | `offlineu-linux-amd64` | Linux x86_64 二进制 |
          | `offlineu-linux-arm64` | Linux ARM64 二进制 |
          | `offlineu-windows-amd64.exe` | Windows x86_64 二进制 |
          | `offlineu_${{ steps.ver.outputs.version }}_x86.fpk` | 飞牛OS 应用包 |
          | `checksums.txt` | SHA-256 校验和 |

          版本号跟随 git tag（`${{ github.ref_name }}` → `${{ steps.ver.outputs.version }}`），二进制内 `Version` 与镜像 tag 同步。
