# 离线安装：镜像随 fpk 内置（app/docker/offlineu-image.tar）。
# 由 cmd/install_init 在安装阶段把镜像 docker load 进本地，fnOS 随后通过
# docker-project 启动本容器；pull_policy: never，全程不访问任何远程仓库。
#
#  - 网络：bridge + 端口映射（fnOS 应用中心据此暴露/反代端口，最稳妥）。
#  - data：固定挂载到安装目录下的 app/docker/data（进度 + 课程列表，可读写）。
#  - courses：由安装向导手动指定的宿主机绝对路径，挂到 /courses:ro。
#    向导字段 OFFLINEU_COURSES / OFFLINEU_HTTP_PORT / OFFLINEU_TZ 由 fnOS 注入 compose。
services:
  offlineu:
    image: offlineu:local
    container_name: offlineu
    pull_policy: never
    user: "0:0"
    environment:
      - OFFLINEU_HOST=0.0.0.0
      - OFFLINEU_PORT=${OFFLINEU_HTTP_PORT:-5000}
      - OFFLINEU_ROOTS=/courses
      - OFFLINEU_PROGRESS_DIR=/app/data
      - TZ=${OFFLINEU_TZ:-Asia/Shanghai}
    volumes:
      - ${OFFLINEU_COURSES:-/mnt/offlineu/courses}:/courses:ro
      - ./data:/app/data
    ports:
      - "${OFFLINEU_HTTP_PORT:-5000}:5000"
    restart: unless-stopped
