# 供手动/参考使用。fnOS 安装走的是 native 应用（cmd/main 直接 docker run），
# 并不会读取本文件——内置镜像由 cmd/main 在启动前 docker load 后 `docker run`。
# 这里保持与 cmd/main 等价，便于在任意主机上手工 `docker compose up` 验证。
#
#  - 网络：host 模式（容器自行绑定端口，故 manifest checkport=false，且不写 ports）。
#  - data：映射到持久目录（fnOS 下为 ${TRIM_PKGVAR}/data，手动运行时为 ./data）。
#  - courses：向导指定的宿主机绝对路径，挂到 /courses:ro。
services:
  offlineu:
    image: offlineu:local
    container_name: offlineu
    pull_policy: never
    network_mode: host
    user: "0:0"
    environment:
      - OFFLINEU_HOST=0.0.0.0
      - OFFLINEU_PORT=${OFFLINEU_HTTP_PORT:-5000}
      - OFFLINEU_ROOTS=/courses
      - OFFLINEU_PROGRESS_DIR=/app/data
      - TZ=${OFFLINEU_TZ:-Asia/Shanghai}
    volumes:
      - ${OFFLINEU_COURSES:-/mnt/offlineu/courses}:/courses:ro
      - ./data:/app/data
    restart: unless-stopped
