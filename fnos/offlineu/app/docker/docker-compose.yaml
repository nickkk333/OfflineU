# 离线安装：镜像已随 fpk 内置（app/docker/offlineu-image.tar），
# 由 cmd/main（native 应用）在启动前 docker load，再 docker compose up。
# 不再依赖任何远程仓库；pull_policy: never。
# 课程库挂载在 ./courses（只读），进度数据在 ./data。
services:
  offlineu:
    image: offlineu:local
    container_name: offlineu
    pull_policy: never
    # 以 root 运行，避免 NAS 上课程目录的权限问题（镜像内已做能力降级处理）。
    user: "0:0"
    environment:
      - OFFLINEU_HOST=0.0.0.0
      - OFFLINEU_PORT=5000
      - OFFLINEU_ROOTS=/courses
      - OFFLINEU_PROGRESS_DIR=/app/data
      - TZ=${OFFLINEU_TZ:-Asia/Shanghai}
    volumes:
      - ./courses:/courses:ro
      - ./data:/app/data
    ports:
      - "${OFFLINEU_HTTP_PORT:-5000}:5000"
    restart: unless-stopped
