# fnOS 应用中心安装后会直接执行本 compose 来启停应用。
# 仅需把镜像 ghcr.io/nickkk333/offlineu:main 跑起来，端口 5000 对外。
# 课程库挂载在 ./courses（只读），进度数据在 ./data。
services:
  offlineu:
    image: ghcr.io/nickkk333/offlineu:main
    container_name: offlineu
    pull_policy: always
    # 以 root 运行，避免 NAS 上课程目录的权限问题（镜像内已做能力降级处理）。
    user: "0:0"
    environment:
      - OFFLINEU_HOST=0.0.0.0
      - OFFLINEU_PORT=5000
      - OFFLINEU_ROOTS=/courses
      - OFFLINEU_PROGRESS_DIR=/app/data
      - TZ=${OFFLINEU_TZ:-Asia/Shanghai}
    volumes:
      - ./courses:/courses:ro
      - ./data:/app/data
    ports:
      - "${OFFLINEU_HTTP_PORT:-5000}:5000"
    restart: unless-stopped
