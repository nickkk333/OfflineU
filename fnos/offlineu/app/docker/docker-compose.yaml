# 供手动/参考使用。fnOS 安装走的是 native 应用（cmd/main 直接 docker run），
# 并不会读取本文件——内置镜像由 cmd/main 在启动前 docker load 后 `docker run`。
# 这里保持与 cmd/main 等价，便于在任意主机上手工 `docker compose up` 验证。
#
#  - 网络：host 模式（容器自行绑定端口，故 manifest checkport=false，且不写 ports）。
#  - data：映射到持久目录（fnOS 下为 ${TRIM_PKGVAR}/data，手动运行时为 ./data）。
#  - courses：向导指定的宿主机绝对路径，挂到 /courses:ro。
services:
  offlineu:
    image: offlineu:local
    container_name: offlineu
    pull_policy: never
    network_mode: host
    user: "0:0"
    environment:
      - OFFLINEU_HOST=0.0.0.0
      - OFFLINEU_PORT=${OFFLINEU_HTTP_PORT:-5000}
      - OFFLINEU_ROOTS=/courses
      - OFFLINEU_PROGRESS_DIR=/app/data
      # Converted media (HLS segments, remuxed files). /tmp is the small system
      # disk on a NAS, so keep it inside the app folder instead.
      - OFFLINEU_CACHE_DIR=/app/cache
      - OFFLINEU_CACHE_LIMIT_GB=20
      # Re-encoding: cap at 720p (only shrinks), and pick whichever hardware
      # encoder the machine has (NVENC / Quick Sync / VAAPI / AMF / V4L2 / RKMPP).
      # - OFFLINEU_TRANSCODE_HEIGHT=720
      # - OFFLINEU_HWACCEL=auto
      - TZ=${OFFLINEU_TZ:-Asia/Shanghai}
    volumes:
      - ${OFFLINEU_COURSES:-/mnt/offlineu/courses}:/courses:ro
      - ./data:/app/data
      - ./cache:/app/cache
    # 硬件转码（OFFLINEU_HWACCEL=auto 时）需要宿主机对应的设备节点：只启用真实存在
    # 的那些，否则 Docker 会因设备不存在而拒绝启动。
    devices:
      - /dev/dri:/dev/dri          # Intel / AMD / Rockchip 核显（VAAPI、QSV、RKMPP）
    #   - /dev/video0:/dev/video0    # ARM V4L2（如树莓派）
    #   - /dev/nvidia0:/dev/nvidia0  # NVIDIA（NVENC，还需 nvidiactl、nvidia-uvm）
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    restart: unless-stopped
