plugins {
    id 'com.android.application'
}

// CI passes -PappVersionName / -PappVersionCode for tagged builds so the APK
// carries the release version. Local builds keep the defaults below.
def appVersionName = project.hasProperty('appVersionName')
        ? project.property('appVersionName').toString()
        : '1.0.0'
def appVersionCode = project.hasProperty('appVersionCode')
        ? project.property('appVersionCode').toString().toInteger()
        : 1

android {
    namespace 'com.nickkk333.offlineu'
    compileSdk 34

    defaultConfig {
        applicationId "com.nickkk333.offlineu"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            // The app is a thin WebView shell and has no reflection-heavy
            // dependencies, so no shrinking is necessary. Enable R8 if the
            // release APK size ever matters; nothing here needs keep rules.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No AndroidX (and therefore no external) dependencies: the whole app uses
// android.* platform APIs so it also builds on a minimal, offline SDK.
dependencies {
}
